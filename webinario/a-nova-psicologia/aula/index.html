<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Abrindo a aula no Google Meet | doco</title>
  <script>
    window.dataLayer = window.dataLayer || [];
    window.gtag = window.gtag || function () { window.dataLayer.push(arguments); };
    window.gtag('consent', 'default', {
      ad_storage: 'denied', analytics_storage: 'denied', ad_user_data: 'denied', ad_personalization: 'denied'
    });
    if (localStorage.getItem('doco_cookie_consent') === 'granted') {
      window.gtag('consent', 'update', {
        ad_storage: 'granted', analytics_storage: 'granted', ad_user_data: 'granted', ad_personalization: 'granted'
      });
    }

    const query = new URLSearchParams(location.search);
    const fallbackEventId = `anp-meet-${Date.now()}-${crypto.randomUUID?.() || Math.random().toString(36).slice(2)}`;
    let savedLead = {};
    try {
      const candidate = JSON.parse(sessionStorage.getItem('doco_anp_lead') || localStorage.getItem('doco_anp_lead') || '{}');
      if (Number(candidate.stored_at || 0) > Date.now() - (30 * 24 * 60 * 60 * 1000)) savedLead = candidate;
    } catch (_) {}
    const leadData = {
      name: String(query.get('name') || savedLead.name || '').trim().slice(0, 200),
      email: String(query.get('email') || savedLead.email || '').trim().toLowerCase().slice(0, 320),
      phone: String(query.get('phone') || savedLead.phone || '').replace(/\D/g, '').slice(0, 40)
    };
    const eventId = String(savedLead.meet_event_id || query.get('event_id') || fallbackEventId).slice(0, 200);
    const sha256 = async (value) => {
      const bytes = new TextEncoder().encode(String(value || '').trim().toLowerCase());
      const digest = await crypto.subtle.digest('SHA-256', bytes);
      return Array.from(new Uint8Array(digest), (byte) => byte.toString(16).padStart(2, '0')).join('');
    };
    window.dataLayer.push({
      event: 'ParticipouWebinario',
      event_id: eventId,
      event_name: 'ParticipouWebinario',
      funnel: 'a_nova_psicologia',
      destination: 'google_meet',
      source_url: location.href
    });

    if (localStorage.getItem('doco_cookie_consent') === 'granted') {
      const gtm = document.createElement('script');
      gtm.async = true;
      gtm.src = 'https://www.googletagmanager.com/gtm.js?id=GTM-WJ7MXFDT';
      document.head.appendChild(gtm);
    }

    const attributionKeys = ['utm_source', 'utm_medium', 'utm_campaign', 'utm_content', 'utm_term', 'gclid', 'fbclid', 'ttclid'];
    const attribution = attributionKeys.reduce((result, key) => {
      const value = query.get(key) || localStorage.getItem(`doco_last_${key}`) || sessionStorage.getItem(`doco_${key}`);
      if (value) result[key] = value;
      return result;
    }, {});

    // The legacy flag only proved that the router succeeded; it did not prove
    // that Meta CAPI succeeded. Honor it for the router to avoid a replay, but
    // let Meta retry independently.
    const routerAlreadySent = localStorage.getItem('doco_anp_meet_router_sent') === eventId
      || localStorage.getItem('doco_anp_meet_sent') === eventId;
    const metaAlreadySent = localStorage.getItem('doco_anp_meet_meta_sent') === eventId;
    const mauticAlreadySent = localStorage.getItem('doco_anp_meet_mautic_sent') === eventId;
    const routerRequest = routerAlreadySent ? Promise.resolve() : fetch('/api/anp-events', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      keepalive: true,
      body: JSON.stringify({
        event_name: 'ParticipouWebinario',
        event_id: eventId,
        event_time: Math.floor(Date.now() / 1000),
        source: 'website',
        source_url: location.href,
        consent: localStorage.getItem('doco_cookie_consent') === 'granted',
        name: leadData.name,
        contact: leadData,
        ...attribution
      })
    }).then((response) => {
      if (!response.ok) throw new Error(`Tracking HTTP ${response.status}`);
      localStorage.setItem('doco_anp_meet_router_sent', eventId);
    }).catch(() => {
      localStorage.setItem('doco_anp_meet_router_pending', eventId);
    });

    const metaRequest = metaAlreadySent ? Promise.resolve() : Promise.all([
      leadData.email ? sha256(leadData.email) : Promise.resolve(''),
      leadData.phone ? sha256(leadData.phone.startsWith('55') ? leadData.phone : `55${leadData.phone}`) : Promise.resolve(''),
      sha256(leadData.email || leadData.phone || eventId)
    ]).then(([emailHash, phoneHash, externalId]) => fetch('/api/meta-capi', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      keepalive: true,
      body: JSON.stringify({
        event_name: 'ParticipouWebinario',
        event_id: eventId,
        event_time: Math.floor(Date.now() / 1000),
        action_source: 'website',
        event_source_url: location.href,
        user_data: {
          em: emailHash ? [emailHash] : undefined,
          ph: phoneHash ? [phoneHash] : undefined,
          external_id: [externalId],
          client_user_agent: navigator.userAgent
        },
        custom_data: { content_name: 'A nova psicologia', funnel_stage: 'webinar_attended' }
      })
    })).then((response) => {
      if (!response.ok) throw new Error(`Meta CAPI HTTP ${response.status}`);
      localStorage.setItem('doco_anp_meet_meta_sent', eventId);
    }).catch(() => {
      localStorage.setItem('doco_anp_meet_meta_pending', eventId);
    });

    const mauticRequest = mauticAlreadySent || !leadData.email ? Promise.resolve() : (() => {
      const formData = new URLSearchParams();
      formData.set('mauticform[email]', leadData.email);
      formData.set('mauticform[formId]', '10');
      formData.set('mauticform[formName]', 'webhookparticipoudowebinario');
      return fetch('/api/mautic-webinar-attended', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' },
        body: formData,
        keepalive: true,
        redirect: 'manual'
      }).then((response) => {
        if (!response.ok && response.type !== 'opaqueredirect' && response.status !== 0) {
          throw new Error(`Mautic HTTP ${response.status}`);
        }
        localStorage.setItem('doco_anp_meet_mautic_sent', eventId);
      }).catch(() => {
        localStorage.setItem('doco_anp_meet_mautic_pending', eventId);
      });
    })();

    Promise.race([
      Promise.allSettled([routerRequest, metaRequest, mauticRequest]),
      new Promise((resolve) => window.setTimeout(resolve, 4000))
    ]).finally(() => location.replace('https://meet.google.com/onf-qfve-ihf'));
  </script>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f3ede4; color: #1f2b22; font: 16px/1.5 Arial, sans-serif; text-align: center; }
    main { width: min(90%, 34rem); padding: 2rem; }
    a { color: #1f2b22; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <p>Registrando seu acesso e abrindo a aula no Google Meet…</p>
    <p><a href="https://meet.google.com/onf-qfve-ihf">Clique aqui se a aula não abrir automaticamente</a></p>
  </main>
</body>
</html>
